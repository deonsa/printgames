name: PrintGames regression tests

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install PDF inspection dependency
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install project and test dependencies
        run: uv sync --group dev
      - name: Verify all generators, MCP interfaces and PDF exports
        run: uv run pytest -q
